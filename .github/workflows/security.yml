name: Security checks

on:
  pull_request:
    branches: [main, develop]
    types: [opened, synchronize, reopened, ready_for_review, edited]
  push:
    branches: [main, develop]
  schedule:
    - cron: '17 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  semgrep:
    name: Semgrep
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Scan Python and Django
        env:
          SEMGREP_RULES_REV: a5ad1714f00c9f7fde980cab0ea1d6dc6d414fd2
          SEMGREP_SEND_METRICS: 'off'
        run: |
          python3 -m venv "$RUNNER_TEMP/semgrep"
          "$RUNNER_TEMP/semgrep/bin/python" -m pip install 'semgrep==1.187.0'
          mkdir -p "$RUNNER_TEMP/semgrep-rules" security-reports
          curl --fail --silent --show-error --location --retry 3 \
            "https://codeload.github.com/semgrep/semgrep-rules/tar.gz/$SEMGREP_RULES_REV" \
            --output "$RUNNER_TEMP/rules.tar.gz"
          tar -xzf "$RUNNER_TEMP/rules.tar.gz" --strip-components=1 -C "$RUNNER_TEMP/semgrep-rules"
          configs=(
            --config "$RUNNER_TEMP/semgrep-rules/python/django/security"
            --config "$RUNNER_TEMP/semgrep-rules/python/lang/security"
          )
          if [[ -d .github/security/semgrep ]]; then
            configs+=(--config .github/security/semgrep)
          fi
          "$RUNNER_TEMP/semgrep/bin/semgrep" scan "${configs[@]}" --metrics off \
            --strict --disable-nosem --json --output security-reports/semgrep.json
          python3 .github/security/check_report.py semgrep security-reports/semgrep.json
      - name: Save the Semgrep report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: semgrep
          path: security-reports/semgrep.json
          retention-days: 14

  dependency_check:
    name: OWASP Dependency-Check
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      NVD_MIRROR: https://dependency-check.github.io/DependencyCheck_Builder/nvd_cache
      ODC_VERSION: '13.0.0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set cache key and check NVD mirror freshness
        id: nvd
        run: |
          echo "key=odc-$ODC_VERSION-$(date -u +%F)" >> "$GITHUB_OUTPUT"
          modified=$(curl --head --fail --silent --show-error --retry 3 \
            --output /dev/null --write-out '%header{last-modified}' \
            "$NVD_MIRROR/nvdcve-modified.json.gz")
          test -n "$modified"
          age=$(( $(date -u +%s) - $(date -u -d "$modified" +%s) ))
          if (( age < 0 || age > 259200 )); then
            echo "::error::NVD mirror feed is outside the 72-hour freshness window"
            exit 1
          fi
          echo "NVD mirror Last-Modified $modified"
      - name: Restore the NVD database
        id: db
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ${{ runner.temp }}/nvd-db
          key: ${{ steps.nvd.outputs.key }}
          restore-keys: odc-${{ env.ODC_VERSION }}-
      - name: Download Dependency-Check and update its database
        run: |
          mkdir -p "$RUNNER_TEMP/nvd-db"
          curl --fail --silent --show-error --location --retry 3 \
            "https://github.com/dependency-check/DependencyCheck/releases/download/v$ODC_VERSION/dependency-check-$ODC_VERSION-release.zip" \
            --output "$RUNNER_TEMP/dependency-check.zip"
          echo "44d920d1ec03e948df862a253f0912782a31b9beee8a7c8895b9cb95760176ed  $RUNNER_TEMP/dependency-check.zip" | sha256sum --check
          unzip -q "$RUNNER_TEMP/dependency-check.zip" -d "$RUNNER_TEMP"
          export JAVA_HOME="$JAVA_HOME_21_X64"
          "$RUNNER_TEMP/dependency-check/bin/dependency-check.sh" --updateonly \
            --data "$RUNNER_TEMP/nvd-db" \
            --nvdDatafeed "$NVD_MIRROR/nvdcve-{0}.json.gz"
      - name: Save the updated database from the default branch
        if: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && steps.db.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ${{ runner.temp }}/nvd-db
          key: ${{ steps.nvd.outputs.key }}
      - name: Check Python dependencies
        run: |
          mkdir -p security-reports
          export JAVA_HOME="$JAVA_HOME_21_X64"
          status=0
          "$RUNNER_TEMP/dependency-check/bin/dependency-check.sh" \
            --project django-sample --scan requirements.txt --enableExperimental \
            --data "$RUNNER_TEMP/nvd-db" --noupdate --disableOssIndex \
            --failOnCVSS 4.0 --format JSON --format HTML --out security-reports || status=$?
          report=security-reports/dependency-check-report.json
          jq -e '.dependencies | any(.[]; .fileName | test("(^|[^a-z])django([^a-z]|$)"; "i"))' "$report" >/dev/null
          jq -r '.dependencies[].vulnerabilities[]? |
            if .severity == "LOW" then "::warning::Dependency-Check: \(.name) (LOW)"
            else [.name, .severity] | @tsv end' "$report"
          jq -e 'all(.dependencies[].vulnerabilities[]?;
            .cvssv2 != null or .cvssv3 != null or .cvssv4 != null
            or ((.severity // "") | IN("LOW", "MEDIUM", "HIGH", "CRITICAL")))' "$report" >/dev/null
          exit "$status"
      - name: Save Dependency-Check reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dependency-check
          path: security-reports/
          retention-days: 14

  zap:
    name: ZAP
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      ZAP_IMAGE: ghcr.io/zaproxy/zaproxy:stable@sha256:9624669db72f54d86c4b46a7064518bd9bf79d8c61a4c31befa9923489f328af
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build and start the Django sample
        run: |
          docker build --pull --tag django-zap:pr .
          docker pull "$ZAP_IMAGE"
          docker network create --internal zap-scan
          docker run --detach --name django --network zap-scan \
            --cap-drop ALL --security-opt no-new-privileges django-zap:pr
          for attempt in {1..20}; do
            if [[ $(docker inspect --format '{{.State.Health.Status}}' django) == healthy ]]; then
              exit 0
            fi
            sleep 2
          done
          docker logs --tail 30 django
          echo "::error::Django did not pass its HTTP health check"
          exit 1
      - name: Run the passive scan and evaluate severity
        run: |
          mkdir -p "$RUNNER_TEMP/zap-reports"
          status=0
          docker run --rm --network zap-scan --user "$(id -u):$(id -g)" \
            --cap-drop ALL --security-opt no-new-privileges -e HOME=/tmp \
            --volume "$PWD/.github/security/zap.yml:/zap/plan.yml:ro" \
            --volume "$RUNNER_TEMP/zap-reports:/zap/wrk" \
            "$ZAP_IMAGE" zap.sh -cmd -dir /tmp/zap-session \
            -config autoupdate.checkOnStart=false -autorun /zap/plan.yml || status=$?
          report="$RUNNER_TEMP/zap-reports/zap-report.json"
          test -s "$RUNNER_TEMP/zap-reports/zap-report.html"
          jq -e '.site | type == "array" and length > 0' "$report" >/dev/null
          jq -r '.site[].alerts[]? | select((.riskcode | tonumber) == 1) | "::warning::ZAP: \(.alert)"' "$report"
          exit "$status"
      - name: Save ZAP reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: zap
          path: ${{ runner.temp }}/zap-reports
          retention-days: 14

  gitleaks:
    name: Gitleaks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Check committed changes for secrets
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          curl --fail --silent --show-error --location --retry 3 \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            --output "$RUNNER_TEMP/gitleaks.tar.gz"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
          args=(--redact=100 --no-banner --exit-code 1)
          if [[ "$GITHUB_EVENT_NAME" == pull_request ]]; then
            git cat-file -e "${BASE_SHA}^{commit}"
            git cat-file -e "${HEAD_SHA}^{commit}"
            args+=(--log-opts="${BASE_SHA}..${HEAD_SHA}")
          else
            args+=(--log-opts=--all)
          fi
          "$RUNNER_TEMP/gitleaks" git "${args[@]}" .

  trivy:
    name: Trivy
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Trivy and build the app image
        run: |
          curl --fail --silent --show-error --location --retry 3 \
            https://github.com/aquasecurity/trivy/releases/download/v0.76.2/trivy_0.76.2_Linux-64bit.tar.gz \
            --output "$RUNNER_TEMP/trivy.tar.gz"
          echo "bc0fc726e017b8927a62b2d3531d7a84ee01769daf5c99ed866dced54089fdbf  $RUNNER_TEMP/trivy.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/trivy.tar.gz" -C "$RUNNER_TEMP" trivy
          docker build --pull --tag django-trivy:pr .
      - name: Scan dependencies, configuration and image
        run: |
          mkdir -p security-reports
          "$RUNNER_TEMP/trivy" fs --scanners vuln,misconfig --list-all-pkgs \
            --format json --output security-reports/trivy-filesystem.json .
          "$RUNNER_TEMP/trivy" image --scanners vuln --image-src docker --list-all-pkgs \
            --format json --output security-reports/trivy-image.json django-trivy:pr
          for report in security-reports/trivy-*.json; do
            jq -e '.Results | type == "array" and length > 0' "$report" >/dev/null
            jq -r '.Results[] | (.Vulnerabilities[]?, .Misconfigurations[]?) |
              (.VulnerabilityID // .ID) as $id | (.PkgName // .Type) as $target |
              if .Severity == "LOW" or .Severity == "UNKNOWN" then
                "::warning::Trivy: \($id) \($target) (\(.Severity))"
              else [.Severity, $id, $target, .InstalledVersion, .FixedVersion] | @tsv end' "$report"
          done
          jq -se 'all(.[].Results[] | (.Vulnerabilities[]?, .Misconfigurations[]?);
            .Severity == "LOW" or .Severity == "UNKNOWN")' security-reports/trivy-*.json >/dev/null
      - name: Save Trivy reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: trivy
          path: security-reports/
          retention-days: 14

  codeql:
    name: CodeQL
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@915412ff23e8b7659517e607487dbeae018f2934 # v4.39.5
        with:
          languages: python
          build-mode: none
          queries: security-extended
      - uses: github/codeql-action/analyze@915412ff23e8b7659517e607487dbeae018f2934 # v4.39.5
        with:
          category: /language:python
          output: ${{ runner.temp }}/codeql-results
      - name: Apply the Medium threshold to CodeQL results
        run: python3 .github/security/check_report.py codeql "$RUNNER_TEMP"/codeql-results/*.sarif

  security_gate:
    name: security-gate
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    needs: [semgrep, dependency_check, zap, gitleaks, trivy, codeql]
    if: ${{ always() }}
    permissions: {}
    steps:
      - name: Require every scanner to pass
        env:
          JOB_RESULTS: ${{ toJSON(needs) }}
        run: |
          jq -r 'to_entries[] | "\(.key): \(.value.result)"' <<< "$JOB_RESULTS"
          jq -e 'length == 6 and all(.[]; .result == "success")' <<< "$JOB_RESULTS" >/dev/null
